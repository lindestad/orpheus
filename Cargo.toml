[package]
name = "orpheus-input"
version = "0.2.1"
edition = "2024"
description = "Mouse polling-rate monitor and switcher for high-rate HID mice."
license = "MIT"
repository = "https://github.com/lindestad/orpheus"
readme = "README.md"
keywords = ["mouse", "hid", "polling", "tui", "windows"]

[lib]
name = "orpheus"
path = "src/lib.rs"

[[bin]]
name = "orpheus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wayland", "wgpu"] }
hidapi = "2.6.6"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.38.4"
toml = "1.1.2"
dirs = "6.0.0"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
tray-icon = { version = "0.26.0", default-features = false }
windows-registry = "0.6.1"
winit = { version = "0.30.13", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.31"
